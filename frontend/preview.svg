<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e6f6f8"/>
      <stop offset="100%" stop-color="#f5f8f8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="#0e9aab"/>

  <!-- Card panel (right side) -->
  <rect x="680" y="60" width="460" height="510" rx="16" fill="white" opacity="0.95"
        filter="drop-shadow(0 4px 24px rgba(14,154,171,0.10))"/>

  <!-- Card header bar -->
  <rect x="680" y="60" width="460" height="52" rx="16" fill="#0e9aab"/>
  <rect x="680" y="96" width="460" height="16" fill="#0e9aab"/>
  <text x="912" y="93" font-family="Georgia,serif" font-size="17" font-weight="600"
        fill="white" text-anchor="middle">Privacy Facts</text>

  <!-- Card rows -->
  <rect x="700" y="132" width="420" height="38" rx="8" fill="#f5f8f8"/>
  <text x="720" y="156" font-family="Arial,sans-serif" font-size="13" fill="#697370">Data moves</text>
  <rect x="1040" y="140" width="60" height="22" rx="11" fill="#fff3cd"/>
  <text x="1070" y="155" font-family="Arial,sans-serif" font-size="12" font-weight="600"
        fill="#856404" text-anchor="middle">4 found</text>

  <rect x="700" y="180" width="420" height="38" rx="8" fill="#f5f8f8"/>
  <text x="720" y="204" font-family="Arial,sans-serif" font-size="13" fill="#697370">Violations</text>
  <rect x="1040" y="188" width="60" height="22" rx="11" fill="#fde8e8"/>
  <text x="1070" y="203" font-family="Arial,sans-serif" font-size="12" font-weight="600"
        fill="#9b1c1c" text-anchor="middle">2 flags</text>

  <rect x="700" y="228" width="420" height="38" rx="8" fill="#f5f8f8"/>
  <text x="720" y="252" font-family="Arial,sans-serif" font-size="13" fill="#697370">Harms identified</text>
  <rect x="1008" y="236" width="112" height="22" rx="11" fill="#fde8e8"/>
  <text x="1064" y="251" font-family="Arial,sans-serif" font-size="12" font-weight="600"
        fill="#9b1c1c" text-anchor="middle">Surveillance</text>

  <rect x="700" y="280" width="420" height="58" rx="8" fill="#e6f6f8"/>
  <text x="720" y="300" font-family="Arial,sans-serif" font-size="12" fill="#0a6b78" font-weight="600">Data sent to third parties</text>
  <text x="720" y="318" font-family="Arial,sans-serif" font-size="11" fill="#697370">User location · session tokens · email</text>

  <rect x="700" y="348" width="420" height="58" rx="8" fill="#e6f6f8"/>
  <text x="720" y="368" font-family="Arial,sans-serif" font-size="12" fill="#0a6b78" font-weight="600">Stored beyond session</text>
  <text x="720" y="386" font-family="Arial,sans-serif" font-size="11" fill="#697370">Conversation history · user preferences</text>

  <!-- Card footer -->
  <text x="912" y="450" font-family="Arial,sans-serif" font-size="11" fill="#b0bab8"
        text-anchor="middle">Generated by SkillXray static analysis</text>

  <!-- Left side: branding -->
  <text x="80" y="190" font-family="Georgia,serif" font-size="72" font-weight="700"
        fill="#1b2422" letter-spacing="-2">SkillXray</text>

  <text x="80" y="255" font-family="Arial,sans-serif" font-size="24" fill="#0a6b78"
        font-weight="600">See what an AI skill</text>
  <text x="80" y="290" font-family="Arial,sans-serif" font-size="24" fill="#0a6b78"
        font-weight="600">actually does with your data.</text>

  <text x="80" y="350" font-family="Arial,sans-serif" font-size="17" fill="#697370">Static code analysis. No execution.</text>
  <text x="80" y="378" font-family="Arial,sans-serif" font-size="17" fill="#697370">Plain-language Privacy Card.</text>

  <!-- Bottom tagline -->
  <text x="80" y="480" font-family="Arial,sans-serif" font-size="14" fill="#b0bab8">
    keerthi166.github.io/SkillXRay
  </text>

  <!-- Decorative dots -->
  <circle cx="600" cy="120" r="4" fill="#0e9aab" opacity="0.3"/>
  <circle cx="620" cy="180" r="3" fill="#0e9aab" opacity="0.2"/>
  <circle cx="590" cy="240" r="5" fill="#0e9aab" opacity="0.15"/>
  <circle cx="635" cy="300" r="3" fill="#0e9aab" opacity="0.2"/>
  <circle cx="605" cy="380" r="4" fill="#0e9aab" opacity="0.15"/>
</svg>
